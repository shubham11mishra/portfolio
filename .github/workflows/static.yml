name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Action to fetch your repository code

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a compatible Node.js version
          cache: 'npm' # Caches npm dependencies for faster installs

      - name: Install dependencies
        run: npm ci # Installs project dependencies

      - name: Build React app
        run: npm run build # Runs the build command to generate the 'dist' or 'build' folder

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch where the build files will be pushed to
          folder: dist # The folder containing the built files (change to 'build' if using Create React App)

